id: yt_video
canal: YouTube
formato: Vídeo
nome: YouTube — Vídeo
quando_usar: Demonstração longa, webinar gravado, deep dive. Ativo permanente e indexável.
exige:
- icp
- promessa
- prova
- cta
specs:
  titulo_max: 100
  descricao_max: 5000
  thumb: 1280x720
  duracao_min_s: 300
  capitulos: true
template: 'título: {a promessa, sem clickbait}

  0-30s: {o problema e o que o vídeo entrega}

  corpo: {capítulos}

  fim: {cta}'
restricoes: []
