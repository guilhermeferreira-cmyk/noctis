id: email_outbound
canal: E-mail
formato: Outbound frio
nome: E-mail — Outbound frio
quando_usar: Primeiro contato com quem não pediu. Curto, específico, com uma pergunta.
exige:
- icp
- prova
specs:
  assunto_max: 50
  corpo_palavras_max: 120
